[package]
name = "ytharbor"
version = "0.1.1"
description = "A lightweight, local-first desktop video downloader"
authors = ["YtHarbor contributors"]
edition = "2021"

[lib]
name = "ytharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

