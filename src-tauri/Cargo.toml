[package]
name = "ytharbor"
version = "0.2.1"
description = "A lightweight, local-first desktop video downloader"
authors = ["YtHarbor contributors"]
edition = "2021"

[lib]
name = "ytharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
# The Douyin resolver uses an in-memory anonymous visitor session. Rustls keeps
# the Windows installer self-contained and avoids starting any helper process.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

