name: Publish Windows release

on:
  push:
    tags:
      - "v*"

# Avoid two runs trying to create or update the same GitHub Release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always

      # The application bundles these binaries so end users do not need to
      # install yt-dlp, FFmpeg, or Deno separately.
      - name: Prepare bundled download tools
        shell: pwsh
        run: ./scripts/prepare-windows.ps1 -Target x86_64-pc-windows-msvc

      - name: Build installers and publish the matching GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: YtHarbor ${{ github.ref_name }}
          releaseBody: |
            ## Windows installers

            Download the `-setup.exe` installer. Future versions can then be installed from YtHarbor's settings page.

            ## Changelog

            GitHub automatically generates the changelog below from changes since the previous release.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
